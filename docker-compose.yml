# Local dependencies only. The ledger node itself is not in here: it runs from the IDE or
# from `java -jar`, so it can be restarted and debugged without touching this stack.
#
# Port allocation: the node owns 8087 (API) and 55437 (telemetry), so nothing below may
# bind either of them. Kafka is published on 19092 and anvil on 8545.
name: spring-boot-deps

services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: spring-boot-kafka
    ports:
      # Host-facing listener. Matches the KAFKA_BOOTSTRAP_SERVERS default in application.yml.
      - "19092:19092"
    environment:
      # KRaft: this one node is both broker and controller, so there is no ZooKeeper.
      CLUSTER_ID: spring-boot-local-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Three listeners: INTERNAL for container-to-container, EXTERNAL for the host, and
      # CONTROLLER for the KRaft quorum. A client resolves the advertised name, so the
      # host listener must advertise localhost while the internal one advertises the
      # service name.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single node, so nothing can be replicated further than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    container_name: spring-boot-anvil
    # The image entrypoint is a shell wrapper, so anvil is named explicitly.
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      # A block time makes anchor transactions behave like a real chain: submitted first,
      # mined a moment later. Instant mining hides ordering bugs.
      - "--block-time"
      - "1"
      # Deterministic accounts, so a locally deployed registry keeps the same address.
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  kafka-data:
